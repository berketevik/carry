  <path d="M400 160H425V92H444" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#h)"/>
  <path d="M425 160V230H444" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#h)"/>
  <path d="M675 92H697V145H714" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#h)"/>
  <path d="M675 230H697V175H714" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#h)"/>
  <line x1="20" y1="306" x2="980" y2="306" stroke="#d0d7de"/>
  <text x="20" y="342" class="h">2 · You ask a question</text>
  <rect x="10" y="440" width="140" height="80" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="26" y="472" class="t">Question</text>
  <text x="26" y="494" class="s">you ask</text>
  <rect x="190" y="370" width="180" height="80" rx="8" fill="#fbefdc" stroke="#b0661a" stroke-width="1.5"/>
  <text x="206" y="402" class="t">Search by words</text>
  <text x="206" y="424" class="s">exact terms</text>
  <rect x="190" y="510" width="180" height="80" rx="8" fill="#dff1ef" stroke="#0f7c78" stroke-width="1.5"/>
  <text x="206" y="542" class="t">Search by meaning</text>
  <text x="206" y="564" class="s">synonyms too</text>
  <rect x="410" y="440" width="150" height="80" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="426" y="472" class="t">Combine</text>
  <text x="426" y="494" class="s">one ranking</text>
  <rect x="600" y="432" width="190" height="96" rx="8" fill="#ece6f8" stroke="#6a4bb5" stroke-width="1.5"/>
  <text x="616" y="464" class="t">Assistant picks</text>
  <text x="616" y="486" class="s">drops passages that</text>
  <text x="616" y="504" class="s">don&#39;t answer</text>
