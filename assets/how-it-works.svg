<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="How Carry works: notes are split into passages and indexed by words and by meaning on your computer; a question is searched both ways, the results are combined, your assistant keeps the passages that answer and replies with sources.">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}.t{font-size:16px;font-weight:600}.s{font-size:13px;fill:#59636e}.h{font-size:15px;font-weight:600;fill:#59636e}</style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker></defs>
  <rect x="0.5" y="0.5" width="999" height="619" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="36" class="h">1 · Your notes are prepared, on your computer</text>
  <rect x="20" y="120" width="170" height="80" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="36" y="152" class="t">Notes</text>
  <text x="36" y="174" class="s">Markdown files</text>
  <rect x="230" y="120" width="170" height="80" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="246" y="152" class="t">Split into passages</text>
  <text x="246" y="174" class="s">short sections</text>
  <rect x="450" y="52" width="225" height="80" rx="8" fill="#dff1ef" stroke="#0f7c78" stroke-width="1.5"/>
  <text x="466" y="84" class="t">Meaning to numbers</text>
  <text x="466" y="106" class="s">local model (Ollama)</text>
  <rect x="450" y="190" width="225" height="80" rx="8" fill="#fbefdc" stroke="#b0661a" stroke-width="1.5"/>
  <text x="466" y="222" class="t">Words listed</text>
  <text x="466" y="244" class="s">which word is where</text>
  <rect x="720" y="110" width="260" height="100" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="736" y="142" class="t">Search index</text>
  <text x="736" y="164" class="s">one file,</text>
  <text x="736" y="182" class="s">on your computer</text>
