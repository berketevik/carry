[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carry"
version = "0.11.0"
authors = [{ name = "Berke Tevik" }]
description = "Portable local memory for coding agents: Markdown sources, a derived index and an MCP interface."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Search by meaning without Ollama (llama_model), on Ollama's engine: llama.cpp, on the GPU
    # of an Apple Silicon Mac. It is built from source at install (Xcode Command Line Tools);
    # Windows has no compiler by default, so there Carry uses Ollama or searches by words.
    "numpy>=1.26,<3",
    "llama-cpp-python>=0.3.36,<0.4; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Real semantic retrieval quality. Without these the core still runs and reports
# the degradation instead of pretending the results are semantic.
embed = ["numpy>=1.26,<3"]
yaml = ["PyYAML>=6,<7"]
rerank = ["sentence-transformers>=5,<6", "torch>=2,<3"]

[project.scripts]
carry = "carry.cli:main"
carry-mcp = "carry.mcp_server:main"
carry-hook = "carry.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The synthetic corpus ships with the package: the demo and the acceptance run
# must work from an installed wheel, with no network fetch.
carry = ["py.typed", "fixtures/*/*.md", "fixtures/*/*/*.md",
         "templates/vault/*", "templates/vault/*/*", "templates/vault/*/*/*", "app/*.swift", "app/*.icns"]
